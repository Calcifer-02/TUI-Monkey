name: Check and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test
      - run: bun run smoke
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: tui-monkey-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*.vsix
